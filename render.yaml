# Deployment proposal only. Applying this Blueprint provisions a paid web service
# and a persistent disk; review current pricing in Render before applying it.
services:
  - type: web
    name: bueeld-crusoe-hackday
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm install --ignore-scripts --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: bueeld-lab-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: HOST
        value: 0.0.0.0
      - key: LAB_DATA_DIR
        value: /var/data/lab
      - key: CRUSOE_API_KEY
        sync: false
      - key: CRUSOE_MODEL
        value: deepseek-ai/Deepseek-V4-Flash
      - key: MAX_AI_CALLS
        value: "100"
      - key: MAX_AI_CALLS_PER_USER
        value: "20"
      - key: MAX_GITHUB_FETCHES
        value: "20"
